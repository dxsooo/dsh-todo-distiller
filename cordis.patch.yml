# Bundle layer: one top-level row. Its Host half (src/app.ts) serves the
# /todo-distiller routes and runs one Agent Session per dropped document; the
# package's ./client export adds the "待办助理" sidebar entry and page.
# `pnpm dev:patch` generates dev.patch.yml with the absolute source path.
- insert:
    - id: todo-distiller
      name: '@dxsooo/dsh-todo-distiller'
